[package]
name = "parser"
version = "0.1.8"
edition = "2024"
authors = ["Leonard Excoffier"]
license = "MIT"
repository = "https://github.com/excoffierleonard/parser"
description = "A library for extracting text from various file formats including PDF, DOCX, XLSX, PPTX, images via OCR, and more"
readme = "README.md"
keywords = ["parser", "pdf", "docx", "text-extraction", "ocr"]
categories = ["text-processing", "parsing"]

[dependencies]
# Core parsing dependencies
calamine = "0.36.1"
docx-rs = "0.4.22"
infer = "0.22.0"
mime = "0.3.17"
pdf-extract = "0.12.0"
regex = "1.13.1"
tempfile = "3.27.0"
tesseract = "0.15.2"
zip = "8.6.0"

# Web server dependencies
actix-web = "4.14.1"
actix-multipart = "0.8.0"
futures-util = "0.3.34"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"

[dev-dependencies]
criterion = "0.8"
num_cpus = "1.17.0"

[lints.clippy]
pedantic = "warn"

[[bench]]
name = "function_parse"
harness = false
